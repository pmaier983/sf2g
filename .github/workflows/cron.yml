name: Cron — Sync All Users

# Each /api/cron call fits one Cloudflare Workers Free invocation (≤ 50
# subrequests), so this job calls `task=sync` repeatedly until the endpoint
# reports `remaining: 0`, then refreshes the materialized views once and
# recomputes group rides.
#
# GitHub delivers scheduled runs on a best-effort basis (often every 1–3 h for
# an hourly schedule). Riders synced within the last 4 hours are skipped, so
# extra runs are cheap.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-sync
  cancel-in-progress: false

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30

    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ vars.APP_URL || 'https://sf2ging.com' }}

    steps:
      - name: Define helper
        run: |
          cat > "$RUNNER_TEMP/call.sh" <<'EOF'
          #!/usr/bin/env bash
          # Usage: call.sh <task>  — POSTs /api/cron?task=<task>, prints the JSON
          # body, retries transient failures, exits 1 on ok:false or non-200.
          set -uo pipefail
          task="$1"
          for attempt in 1 2 3; do
            out=$(curl -s -w '\n%{http_code}' --connect-timeout 30 --max-time 300 \
              -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "User-Agent: SF2G-CronBot/2.0 (GitHub Actions)" \
              -H "Accept: application/json" \
              "${APP_URL}/api/cron?task=${task}")
            code=$(echo "$out" | tail -1)
            body=$(echo "$out" | sed '$d')
            if [ "$code" = "200" ]; then
              echo "$body"
              echo "$body" | jq -e '.ok == true' > /dev/null || exit 1
              exit 0
            fi
            echo "::warning::task=${task} attempt ${attempt}: HTTP ${code}" >&2
            if [ "$code" = "403" ] && echo "$body" | grep -q "challenge-platform"; then
              echo "::warning::Cloudflare challenged the request — add a WAF skip rule for /api/cron" >&2
            fi
            echo "$body" | head -c 500 >&2; echo >&2
            sleep $((attempt * 10))
          done
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/call.sh"

      - name: Sync riders (repeat until none are due)
        run: |
          failed=0
          for i in $(seq 1 25); do
            if ! body=$("$RUNNER_TEMP/call.sh" sync); then
              failed=1
            fi
            echo "$body" | jq -c '{eligible, remaining, synced, partial, failed, needsReauth, stopReason, subrequests}' 2>/dev/null || echo "$body"
            echo "$body" | jq -r '.results[]? | select(.error) | "::warning::\(.displayName // .userId): \(.error)"' 2>/dev/null || true

            remaining=$(echo "$body" | jq -r '.remaining // 0' 2>/dev/null || echo 0)
            stop=$(echo "$body" | jq -r '.stopReason // ""' 2>/dev/null || echo "")
            if [ "$remaining" = "0" ] || [ "$stop" = "rate_limited" ] || [ "$stop" = "done" ]; then
              break
            fi
          done
          exit $failed

      - name: Refresh materialized views
        if: always()
        run: |
          "$RUNNER_TEMP/call.sh" maintenance | jq -c '{refreshed, errors, subrequests, durationMs}'

      - name: Recompute group rides
        if: always()
        # One SQL call (recompute_group_rides, migration 040).
        run: |
          "$RUNNER_TEMP/call.sh" groups | jq -c '{ok, error, subrequests, durationMs}'
